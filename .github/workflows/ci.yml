name: CI

on:
  push:
    branches: [main]
    tags: ["v*"] # a version tag additionally drafts a GitHub Release
  pull_request:

jobs:
  build:
    # iRacing is Windows-only, so the desktop target is Windows-only.
    runs-on: windows-latest
    permissions:
      contents: write # draft the release + upload installers on v* tags

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --locked

      # Exit criteria for M0: an installable artifact (unsigned .msi/.exe).
      - name: Build Tauri app
        run: pnpm --filter pf_desk tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: parcferme-desktop-unsigned
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      # The website's download button links a version-independent URL
      # (…/releases/latest/download/ParcFerme-Setup.msi — SERVER_CONTRACT §8),
      # so each release also carries a stable-named copy of each installer.
      - name: Stage stable-named installers
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Copy-Item (Get-ChildItem target/release/bundle/msi/*.msi | Select-Object -First 1).FullName ParcFerme-Setup.msi
          Copy-Item (Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName ParcFerme-Setup.exe

      # Distribution path (M5 prep): tagging v* attaches the installers to a
      # DRAFT GitHub Release — nothing goes public until a human presses
      # Publish. Windows code signing slots in here once the EV cert arrives.
      - name: Draft release with installers
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            ParcFerme-Setup.msi
            ParcFerme-Setup.exe
