name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # iRacing is Windows-only, so the desktop target is Windows-only.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test pf_core
        run: cargo test -p pf_core --locked

      # Exit criteria for M0: an installable artifact (unsigned .msi/.exe).
      - name: Build Tauri app
        run: pnpm --filter pf_desk tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: parcferme-desktop-unsigned
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: warn
