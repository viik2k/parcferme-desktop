name: CI

on:
  push:
    branches: [main]
    tags: ["v*"] # a version tag additionally drafts a GitHub Release
  pull_request:

jobs:
  # Linux GUI build (deb + AppImage). Runs first so the Windows job below can
  # fold its bundles into the one draft release + latest.json on tags. The sims
  # stay Windows-only (run under Proton); this is the client itself on Linux.
  linux:
    if: "!(github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore(release):'))"
    runs-on: ubuntu-22.04 # oldest supported glibc, so the AppImage runs on older distros

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # Tauri's webview/tray/bundler deps, plus libdbus for the keyring's
      # Secret Service backend.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev patchelf gnome-keyring

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The keychain tests need a Secret Service, like a real desktop has, or
      # "no token" surfaces as a keychain error instead of NotLinked.
      - name: Test workspace
        run: |
          dbus-run-session -- bash -c "echo -n ci | gnome-keyring-daemon --components=secrets --daemonize --unlock && cargo test --workspace --locked"

      # Bundle targets come from tauri.linux.conf.json (deb + appimage).
      - name: Build Tauri app
        run: pnpm --filter pf_desk tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: parcferme-desktop-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: warn

  build:
    needs: linux
    # Skip the redundant main-branch build of the version-bump commit that
    # release-tag.yml pushes — the real release build runs off its v* tag (a
    # different ref, so this guard doesn't touch it). PRs and normal main pushes
    # (no head_commit / non-release message) are unaffected.
    if: "!(github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore(release):'))"
    runs-on: windows-latest
    permissions:
      contents: write # draft the release + upload installers on v* tags

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # pnpm 11 (via action-setup@v4) requires Node >=22.13
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --locked

      # Exit criteria for M0: an installable artifact (.msi/.exe). On tag builds
      # the signing key (repo secrets) also produces the updater signatures that
      # latest.json carries — see docs/RELEASE.md for the one-time key setup.
      - name: Build Tauri app
        run: pnpm --filter pf_desk tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: parcferme-desktop-unsigned
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      # The website's download button links a version-independent URL
      # (…/releases/latest/download/ParcFerme-Setup.msi — SERVER_CONTRACT §8),
      # so each release also carries a stable-named copy of each installer.
      - name: Download Linux bundles
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@v4
        with:
          name: parcferme-desktop-linux
          path: linux-bundle

      - name: Stage stable-named installers
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Copy-Item (Get-ChildItem target/release/bundle/msi/*.msi | Select-Object -First 1).FullName ParcFerme-Setup.msi
          Copy-Item (Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName ParcFerme-Setup.exe
          Copy-Item (Get-ChildItem linux-bundle/appimage/*.AppImage | Select-Object -First 1).FullName ParcFerme-x86_64.AppImage
          Copy-Item (Get-ChildItem linux-bundle/deb/*.deb | Select-Object -First 1).FullName ParcFerme-amd64.deb

      # Auto-updater manifest: the app polls latest.json (tauri.conf.json →
      # plugins.updater) and verifies the installer against `signature` using the
      # committed pubkey. The signature is over the NSIS setup bytes; the stable-
      # named copy above is byte-identical, so the tag-pinned download URL matches.
      # Skips (with a warning) when the signing key isn't configured yet, so an
      # unsigned draft release still builds.
      - name: Generate updater manifest (latest.json)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $sigFile = Get-ChildItem target/release/bundle/nsis/*-setup.exe.sig -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sigFile) {
            Write-Warning "No updater signature found — set TAURI_SIGNING_PRIVATE_KEY / _PASSWORD secrets to enable auto-updates (see docs/RELEASE.md). Skipping latest.json."
            exit 0
          }
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $signature = (Get-Content $sigFile.FullName -Raw).Trim()
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/ParcFerme-Setup.exe"
          $manifest = [ordered]@{
            version   = $version
            notes     = "See https://github.com/${{ github.repository }}/releases/tag/$tag"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url       = $url
              }
            }
          }
          # AppImage self-updates; keyed `-appimage` so a .deb install finds no
          # entry (the updater tries `{os}-{arch}-{installer}` first, then
          # `{os}-{arch}`) and stays silent rather than dpkg-ing an AppImage.
          $linuxSig = Get-ChildItem linux-bundle/appimage/*.AppImage.sig -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($linuxSig) {
            $manifest.platforms["linux-x86_64-appimage"] = [ordered]@{
              signature = (Get-Content $linuxSig.FullName -Raw).Trim()
              url       = "https://github.com/${{ github.repository }}/releases/download/$tag/ParcFerme-x86_64.AppImage"
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Out-File latest.json -Encoding utf8
          Write-Host "Wrote latest.json for $version"

      # Distribution path: tagging v* attaches the installers + updater manifest
      # to a DRAFT GitHub Release — nothing goes public until a human presses
      # Publish. Windows code signing slots in here once the EV cert arrives.
      - name: Draft release with installers
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            ParcFerme-Setup.msi
            ParcFerme-Setup.exe
            linux-bundle/deb/*.deb
            linux-bundle/appimage/*.AppImage
            ParcFerme-x86_64.AppImage
            ParcFerme-amd64.deb
            latest.json
