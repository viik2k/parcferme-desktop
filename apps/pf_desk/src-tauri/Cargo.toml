[package]
name = "pf_desk"
description = "ParcFerme desktop tray client"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# The shell is a thin wrapper; the reusable logic is exposed as a lib so the
# desktop binary (and, later, integration tests) share one entry point.
[lib]
name = "pf_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Open URLs/paths with the default app (browser links, logs folder in Explorer).
tauri-plugin-opener = "2"
# M3 "Equip" handshake: register the parcferme:// scheme and receive open-url events.
tauri-plugin-deep-link = "2"
# M4 hardening/polish: file logging for support, native folder picker for the
# Settings overrides, and a native Windows toast for equip results.
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
pf_core = { workspace = true }

# Single instance forwards a parcferme:// link opened while the app is already
# running (Windows/Linux spawn a fresh process per link) into the deep-link
# plugin's handler via its "deep-link" feature. Desktop-only (cargo can't read
# Tauri's `desktop` cfg in a target table, so exclude mobile by target_os).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# M4 Settings "Launch at startup" toggle (registry Run key on Windows).
tauri-plugin-autostart = "2"
