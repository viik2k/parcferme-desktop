[package]
name = "pf_core"
description = "ParcFerme desktop core logic (auth, api, paths, download, deeplink)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# Blocking HTTP with rustls — no async runtime, keeps pf_core UI/runtime-agnostic
# and avoids OpenSSL (a Windows packaging win).
ureq = { version = "2", features = ["json"] }
# gzip for telemetry uploads (SERVER_CONTRACT §10) — a session is ~10:1.
flate2 = "1"
# OS keychain: Windows Credential Manager, or the Secret Service (GNOME
# Keyring / KWallet) on Linux. keyring 4's default `v1` feature wires up the
# native stores (target-gated) behind the same Entry API as keyring 3.
keyring = "4"
