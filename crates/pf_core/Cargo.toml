[package]
name = "pf_core"
description = "ParcFerme desktop core logic (auth, api, paths, download, deeplink)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# Blocking HTTP with rustls — no async runtime, keeps pf_core UI/runtime-agnostic
# and avoids OpenSSL (a Windows packaging win).
ureq = { version = "2", features = ["json"] }
# gzip for telemetry uploads (SERVER_CONTRACT §10) — a session is ~10:1.
flate2 = "1"
# OS keychain. v1 is Windows-only → Windows Credential Manager backend.
keyring = { version = "3", features = ["windows-native"] }
